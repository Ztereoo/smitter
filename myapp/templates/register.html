{% extends 'base.html' %}
{% block title %}
Login Page
{% endblock %}
{% block content %}
<form method="post">
    <h4>Wellcome to registration page</h4>
    <h5>Login</h5>
    <input type="text" name="login" placeholder="Enter login">
    <h5>Password</h5>
    <p>Create your password, minimum 6 digits or numbers</p>
    <input type="text" name="pass" placeholder="Enter password">
    <h5>Repeat your password</h5>
    <p>Password confirmation</p>
    <input type="text" name="confirm_pass" placeholder="Repeating your password"> <br>
    <button type="submit">Submit</button>
</form>
{% endblock %}
