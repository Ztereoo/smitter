{% extends 'base.html' %}
{% block title %}
Login Page
{% endblock %}
{% block content %}
<h3>Wellcome to authorisation page</h3>
<p>To create posts please proceed with registration<br>
    <a href="{{url_for('register')}}">Registration page</a>
<p>If you already have an account please enter login details</p>

<form method="post">
    <h5>Login</h5>
    <input type="text" name="login" placeholder="Enter login">
    <h5>Password</h5>
    <input type="text" name="pass" placeholder="Enter password">
    <br>
    <button type="submit">Send request</button>
    <br>
</form>
{% endblock %}
